data:
  tickers: [ "ESH26.CME", "ESM26.CME", "ESU26.CME" ]   # yfinance tickers to download
  symbol: "ESH26.CME"                               # which one to actually research
  interval: "1m"
  period: "7d"
  auto_adjust: false
  progress: false

session:
  rth_tz: "America/New_York"
  rth_start: "09:30"
  rth_end: "16:00"

research:
  horizon_bars: 5
  walkforward:
    train_days: 6
    test_days: 1
    step_days: 1

model:
  type: "logreg"
  prob_threshold: 0.52

backtest:
  point_value: 50.0
  tick_size: 0.25
  slippage_ticks: 1
  commission_per_side: 2.10
  max_position: 1

debug:
  # All OFF by default (None / empty)
  save_raw_snapshot_parquet:
  save_rth_snapshot_parquet:
  save_model_table_parquet:
  save_trades_csv:
  save_equity_csv:
